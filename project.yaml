category: mobile
status: done
name: proxima

description: >
  Инструмент для математической аппроксимации функций — автоматически
  подбирает лучшую модель и показывает результат в виде LaTeX-формулы.

stack:
  - Jetpack Compose
  - Voyager
  - MVVM + UDF
  - Kotlin BigNum
  - LatexRenderer

possibilities:
  - '6 моделей аппроксимации: линейная, квадратичная, кубическая, экспоненциальная, логарифмическая, показательная.'
  - Лучшая модель выбирается автоматически по коэффициенту детерминации R².
  - Формулы рендерятся в LaTeX, график строится в реальном времени.
  - Все вычисления через BigDecimal, чтобы не терять точность.
  - Результат можно скопировать в буфер обмена одним нажатием.
